name: Generate Default OpenWrt Config

on:
  workflow_dispatch: # 允许手动触发

jobs:
  generate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v4
        with:
          repository: xiangtailiang/openwrt
          ref: openwrt-25.12 # 建议指定具体版本，确保可复现
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Default .config
        run: |
          # 关键步骤：生成默认配置
          make defconfig
          
          # （可选）重命名，方便区分
          cp .config default.config

      - name: Upload Config Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-default-config
          path: default.config
